[package]
name = "dyndns"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
slint = "1.18"
ureq = "3.5"
tray-icon = "0.26"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
strip = true
